robot_cfg:
  kinematics:
    use_usd_kinematics: true
    isaac_usd_path: franka.usd
    usd_path: franka.usd
    usd_robot_root: /panda
    usd_flip_joints:
      panda_joint1: 'Z'
      panda_joint2: 'Z'
      panda_joint3: 'Z'
      panda_joint4: 'Z'
      panda_joint5: 'Z'
      panda_joint6: 'Z'
      panda_joint7: 'Z'
      panda_finger_joint1: 'Y'
      panda_finger_joint2: 'Y'
    usd_flip_joint_limits:
      - panda_finger_joint2
    urdf_path: franka_desc/franka1.urdf
    asset_root_path: franka
    base_link: panda_link0
    ee_link: panda_hand
    collision_link_names:
      - panda_link0
      - panda_link1
      - panda_link2
      - panda_link3
      - panda_link4
      - panda_link5
      - panda_link6
      - panda_link7
      - panda_hand
      - panda_leftfinger
      - panda_rightfinger
      - tool_center
    collision_spheres: franka_desc/franka_mesh.yml
    collision_sphere_buffer: 0.001
    # extra_collision_spheres:
    #   tool_center: 4
    use_global_cumul: true
    self_collision_ignore:
      panda_link0:
        - panda_link1
        - panda_link2
      panda_link1:
        - panda_link2
        - panda_link3
        - panda_link4
      panda_link2:
        - panda_link3
        - panda_link4
      panda_link3:
        - panda_link4
        - panda_link6
      panda_link4:
        - panda_link5
        - panda_link6
        - panda_link7
        - panda_link8
      panda_link5:
        - panda_link6
        - panda_link7
        - panda_hand
        - panda_leftfinger
        - panda_rightfinger
      panda_link6:
        - panda_link7
        - panda_hand
        - tool_center
        - panda_leftfinger
        - panda_rightfinger
      panda_link7:
        - panda_hand
        - tool_center
        - panda_leftfinger
        - panda_rightfinger
      panda_hand:
        - panda_leftfinger
        - panda_rightfinger
        - tool_center
      panda_leftfinger:
        - panda_rightfinger
        - tool_center
      panda_rightfinger:
        - tool_center
    self_collision_buffer:
      panda_link0: 0.1
      panda_link1: 0.05
      panda_link2: 0
      panda_link3: 0
      panda_link4: 0
      panda_link5: 0
      panda_link6: 0
      panda_link7: 0
      panda_hand: 0
      panda_leftfinger: 0.01
      panda_rightfinger: 0.01
      tool_center: 0
    mesh_link_names:
      - panda_link0
      - panda_link1
      - panda_link2
      - panda_link3
      - panda_link4
      - panda_link5
      - panda_link6
      - panda_link7
      - panda_hand
      - panda_leftfinger
      - panda_rightfinger
    lock_joints:
      panda_finger_joint1: 0.04
      panda_finger_joint2: -0.04
    extra_links:
      tool_center:
        parent_link_name: panda_hand
        link_name: tool_center
        fixed_transform: [0,0,0.1,1,0,0,0]
        joint_type: FIXED
        joint_name: tool_center_joint
    cspace:
      joint_names:
        - panda_joint1
        - panda_joint2
        - panda_joint3
        - panda_joint4
        - panda_joint5
        - panda_joint6
        - panda_joint7
        - panda_finger_joint1
        - panda_finger_joint2
      retract_config: [0.0, -1.3, 0.0, -2.5, 0.0, 1.0, 0., 0.04, -0.04]
      null_space_weight: [1,1,1,1,1,1,1,1,1]
      cspace_distance_weight: [1,1,1,1,1,1,1,1,1]
      max_acceleration: [15,15,15,15,15,15,15,15,15]
      max_jerk: [500,500,500,500,500,500,500,500,500]